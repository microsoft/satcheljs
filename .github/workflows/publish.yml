name: Publish

on:
    release:
        types: [created]

jobs:
    build_and_publish:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
            - run: yarn
            - run: yarn build
            - run: yarn test
            # Defer auth config until publishing so Yarn does not require NODE_AUTH_TOKEN.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  registry-url: 'https://registry.npmjs.org'
            - name: Publish to npm
              run: npm publish
              env:
                  NPM_CONFIG_TAG: ${{ github.event.release.prerelease && 'beta' || 'latest' }}
